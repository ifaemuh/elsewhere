name: Track rule sources

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sources-track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check out the source collection
        uses: actions/checkout@v4
        with:
          repository: ifaemuh/elsewhere-sources-declarations
          token: ${{ secrets.SOURCES_REPOS_TOKEN }}
          path: ota

      - name: Sync declarations from sources.yaml
        run: |
          npm run -s rules:declarations -w @elsewhere/rules -- --out "$GITHUB_WORKSPACE/ota/declarations"
          cd ota
          git config user.name "elsewhere-sources-bot"
          git config user.email "elsewhere-sources-bot@users.noreply.github.com"
          git add -A declarations
          if ! git diff --cached --quiet; then
            git commit -m "Sync declarations from elsewhere sources.yaml@${GITHUB_SHA::7}"
            git push || { git pull --rebase && git push; }
          fi

      - name: Check out versions
        uses: actions/checkout@v4
        with:
          repository: ifaemuh/elsewhere-sources-versions
          token: ${{ secrets.SOURCES_REPOS_TOKEN }}
          path: ota/data/versions
          fetch-depth: 0

      - name: Check out snapshots
        uses: actions/checkout@v4
        with:
          repository: ifaemuh/elsewhere-sources-snapshots
          token: ${{ secrets.SOURCES_REPOS_TOKEN }}
          path: ota/data/snapshots
          fetch-depth: 0

      - name: Track web sources with Open Terms Archive
        working-directory: ota
        env:
          OTA_ENGINE_GITHUB_TOKEN: ${{ secrets.SOURCES_REPOS_TOKEN }}
        run: |
          npm ci
          npx ota track

      - name: Track eCFR parts
        id: ecfr
        if: ${{ !cancelled() }}
        run: |
          # The fetcher writes every part it could fetch, then exits 1 if any failed.
          # Record its exit code, commit what was fetched, and fail the job at the end.
          rc=0
          npm run -s rules:fetch-ecfr -w @elsewhere/rules -- --versions "$GITHUB_WORKSPACE/ota/data/versions" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cd ota/data/versions
          git config user.name "elsewhere-sources-bot"
          git config user.email "elsewhere-sources-bot@users.noreply.github.com"
          git add -A eCFR
          if ! git diff --cached --quiet; then
            parts=$(git diff --cached --name-only | sed 's#^eCFR/##; s#\.md$##' | paste -sd, -)
            git commit -m "Record eCFR changes: ${parts}"
          fi

      - name: Publish versions and snapshots
        if: ${{ !cancelled() }}
        run: |
          # Snapshots first: versions reference snapshot commit IDs.
          git -C ota/data/snapshots push || { git -C ota/data/snapshots pull --rebase && git -C ota/data/snapshots push; }
          git -C ota/data/versions push || { git -C ota/data/versions pull --rebase && git -C ota/data/versions push; }

      - name: Fail the run if the eCFR fetch failed
        if: ${{ !cancelled() && steps.ecfr.outputs.rc != '0' }}
        run: |
          echo "rules:fetch-ecfr exited with ${{ steps.ecfr.outputs.rc }}; fetched parts were committed and published."
          exit 1
