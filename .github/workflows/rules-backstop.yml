name: Rules quote backstop

on:
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rules-backstop
  cancel-in-progress: false

jobs:
  backstop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check out versions
        uses: actions/checkout@v4
        with:
          repository: ifaemuh/elsewhere-sources-versions
          token: ${{ secrets.SOURCES_REPOS_TOKEN }}
          path: .sources-versions

      - name: Flip verified rules whose quotes no longer match
        id: check
        run: |
          # Exit 1 with "issue(s)" in the output is the expected "quotes missing" result.
          # Any other failure (usage, validation, crash) must fail the job, but only after
          # the PR step has had a chance to publish whatever was flipped.
          rc=0
          npm run -s rules:check-quotes -w @elsewhere/rules -- \
            --versions "$GITHUB_WORKSPACE/.sources-versions" --write-needs-review > "$RUNNER_TEMP/backstop.txt" || rc=$?
          cat "$RUNNER_TEMP/backstop.txt"
          if [ "$rc" -ne 0 ] && { [ "$rc" -ne 1 ] || ! grep -q 'issue(s) in' "$RUNNER_TEMP/backstop.txt"; }; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "rules:check-quotes exited with $rc without a normal issue report."
          fi

      - name: Open a PR when any rule was flipped
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- packages/rules/data; then
            echo "No rule flipped."
            exit 0
          fi
          branch="rules/backstop-$(date -u +%F)"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add packages/rules/data
          git commit -m "Flag rules whose quotes no longer match their sources" -m "$(cat "$RUNNER_TEMP/backstop.txt")"
          git push -u origin "$branch" || { git pull --rebase origin "$branch" 2>/dev/null; git push -u origin "$branch"; }
          gh label create rules-backstop --force --color D93F0B --description "Nightly quote backstop"
          {
            echo "The nightly quote check could not find these quotes in the latest tracked source text."
            echo "Each failing verified rule is now needs_review. Re-verify with packages/rules/RESEARCH.md."
            echo
            echo '```'
            cat "$RUNNER_TEMP/backstop.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" --label rules-backstop \
            --title "Rules backstop: quotes not found ($(date -u +%F))" --body-file "$RUNNER_TEMP/body.md"

      - name: Fail the run if the quote check itself failed
        if: ${{ !cancelled() && steps.check.outputs.failed == 'true' }}
        run: |
          echo "The quote check failed abnormally; see the check step output."
          exit 1
