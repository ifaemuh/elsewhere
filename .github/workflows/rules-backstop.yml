name: Rules quote backstop

on:
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rules-backstop
  cancel-in-progress: false

jobs:
  backstop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci -w @elsewhere/rules --ignore-scripts

      - name: Check out versions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ifaemuh/elsewhere-sources-versions
          token: ${{ secrets.SOURCES_REPOS_TOKEN }}
          path: .sources-versions
          persist-credentials: false

      - name: Flip verified rules whose quotes no longer match
        id: check
        run: |
          # Exit 0 = clean, 1 = quote or supports issues found (expected; --write-needs-review
          # flips verified rules whose quote is absent from fetched text, never on a missing source).
          # Anything else (2 usage, 3 load failure, 4 crash, 5 a flip could not be written) fails the
          # job after the PR step; the other rules' flips are still published (except after 4 or 99).
          rc=0
          npm run -s rules:check-quotes -w @elsewhere/rules -- \
            --versions "$GITHUB_WORKSPACE/.sources-versions" --write-needs-review > "$RUNNER_TEMP/backstop.txt" || rc=$?
          cat "$RUNNER_TEMP/backstop.txt"
          if grep -q 'not checked because their source text is missing' "$RUNNER_TEMP/backstop.txt"; then
            echo "::warning::Some quotes were not checked because source text is missing (tracker outage or incomplete versions checkout). No rule status was changed for them."
          fi
          # Exit 1 is "issues found" only when the tool's own summary line is present; a bare
          # exit 1 (import-time failure, uncaught error before the handler) is abnormal.
          if [ "$rc" -eq 1 ] && ! grep -q 'issue(s) in' "$RUNNER_TEMP/backstop.txt"; then
            rc=99
          fi
          if [ "$rc" -gt 1 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "rules:check-quotes failed abnormally (code $rc)."
          fi
          # A crash (4) or an unmarked exit 1 may have left partial writes: never publish them.
          if [ "$rc" -eq 4 ] || [ "$rc" -eq 99 ]; then
            echo "skip_pr=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a PR when any rule was flipped
        if: ${{ !cancelled() && steps.check.outputs.skip_pr != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- packages/rules/data; then
            echo "No rule flipped."
            exit 0
          fi
          open=$(gh pr list --label rules-backstop --state open --json number --jq length)
          if [ "$open" -gt 0 ]; then
            echo "::notice::A rules-backstop PR is already open; flipped rules were not republished. Merge or close it so the next run can open a new one."
            exit 0
          fi
          today=$(date -u +%F)
          branch="rules/backstop-$today"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::notice::$branch exists with no open PR; opening the PR from it."
          else
            git switch -c "$branch"
            git add packages/rules/data
            git commit -m "Flag rules whose quotes no longer match their sources" -m "$(cat "$RUNNER_TEMP/backstop.txt")"
            git push -u origin "$branch" || { git pull --rebase origin "$branch"; git push -u origin "$branch"; }
          fi
          gh label create rules-backstop --force --color D93F0B --description "Nightly quote backstop"
          {
            echo "The nightly quote check could not find these quotes in the latest tracked source text."
            echo "Each failing verified rule is now needs_review. Re-verify with packages/rules/RESEARCH.md."
            echo
            echo "**Founder:** this PR was opened by GitHub Actions, so its Rules CI run waits for approval."
            echo "Click 'Approve workflows to run' (or close and reopen this PR) so Rules CI runs."
            echo
            echo '```'
            cat "$RUNNER_TEMP/backstop.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" --label rules-backstop \
            --title "Rules backstop: quotes not found ($today)" --body-file "$RUNNER_TEMP/body.md"

      - name: Fail the run if the quote check itself failed
        if: ${{ !cancelled() && steps.check.outputs.failed == 'true' }}
        run: |
          echo "The quote check failed abnormally; see the check step output."
          exit 1
