rule: dl-controllable-delay-care
cases:
  - name: departure delayed exactly 3 hours, Delta's fault
    situation: { flight.marketing_carrier_iata: DL, flight.touches_us: true, event.type: delay, event.cause: controllable, event.departure_delay_minutes: 180 }
    outcome: applies
  - name: departure delayed 179 minutes
    situation: { flight.marketing_carrier_iata: DL, flight.touches_us: true, event.type: delay, event.cause: controllable, event.departure_delay_minutes: 179 }
    outcome: does_not_apply
  - name: delay with cause not yet known
    situation: { flight.marketing_carrier_iata: DL, flight.touches_us: true, event.type: delay, event.cause: unknown, event.departure_delay_minutes: 240 }
    outcome: applies
  - name: delay with only the arrival delay known
    situation: { flight.marketing_carrier_iata: DL, flight.touches_us: true, event.type: delay, event.cause: controllable, event.delay_minutes: 240 }
    outcome: may_apply
    missing_facts: [event.departure_delay_minutes]
  - name: controllable cancellation, no minutes given
    situation: { flight.marketing_carrier_iata: DL, flight.touches_us: true, event.type: cancellation, event.cause: controllable }
    outcome: applies
  - name: controllable missed connection
    situation: { flight.marketing_carrier_iata: DL, flight.touches_us: true, event.type: missed_connection, event.cause: controllable }
    outcome: applies
  - name: cause not stated
    situation: { flight.marketing_carrier_iata: DL, flight.touches_us: true, event.type: cancellation }
    outcome: may_apply
    missing_facts: [event.cause]
  - name: weather cancellation
    situation: { flight.marketing_carrier_iata: DL, flight.touches_us: true, event.type: cancellation, event.cause: uncontrollable }
    outcome: does_not_apply
  - name: another marketing carrier
    situation: { flight.marketing_carrier_iata: UA, flight.touches_us: true, event.type: cancellation, event.cause: controllable }
    outcome: does_not_apply
  - name: marketing carrier not known yet
    situation: { flight.touches_us: true, event.type: cancellation, event.cause: controllable }
    outcome: may_apply
    missing_facts: [flight.marketing_carrier_iata]
  - name: flight does not touch the US
    situation: { flight.marketing_carrier_iata: DL, flight.touches_us: false, event.type: cancellation, event.cause: controllable }
    outcome: does_not_apply
  - name: schedule change is not covered
    situation: { flight.marketing_carrier_iata: DL, flight.touches_us: true, event.type: schedule_change, event.cause: controllable }
    outcome: does_not_apply
