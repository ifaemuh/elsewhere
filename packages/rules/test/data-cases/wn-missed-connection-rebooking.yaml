rule: wn-missed-connection-rebooking
cases:
  - name: missed connection, 180 minutes late, one ticket
    situation: { flight.carrier_iata: WN, event.type: missed_connection, flight.single_ticket: true, event.delay_minutes: 180 }
    outcome: applies
  - name: missed connection, cause does not matter
    situation: { flight.carrier_iata: WN, event.type: missed_connection, flight.single_ticket: true, event.delay_minutes: 300, event.cause: uncontrollable }
    outcome: applies
  - name: 179 minutes late is under the threshold
    situation: { flight.carrier_iata: WN, event.type: missed_connection, flight.single_ticket: true, event.delay_minutes: 179 }
    outcome: does_not_apply
  - name: separate tickets
    situation: { flight.carrier_iata: WN, event.type: missed_connection, flight.single_ticket: false, event.delay_minutes: 300 }
    outcome: does_not_apply
  - name: another carrier
    situation: { flight.carrier_iata: DL, event.type: missed_connection, flight.single_ticket: true, event.delay_minutes: 300 }
    outcome: does_not_apply
  - name: a plain delay is not a missed connection
    situation: { flight.carrier_iata: WN, event.type: delay, flight.single_ticket: true, event.delay_minutes: 300 }
    outcome: does_not_apply
  - name: ticket type not known yet
    situation: { flight.carrier_iata: WN, event.type: missed_connection, event.delay_minutes: 300 }
    outcome: may_apply
    missing_facts: [flight.single_ticket]
  - name: delay length not known yet
    situation: { flight.carrier_iata: WN, event.type: missed_connection, flight.single_ticket: true }
    outcome: may_apply
    missing_facts: [event.delay_minutes]
