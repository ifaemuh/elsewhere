rule: us-dot-tarmac-delay-limits
cases:
  - name: 119 minutes on the tarmac (food and water not yet due)
    situation: { event.type: tarmac_delay, flight.touches_us: true, event.delay_minutes: 119 }
    outcome: does_not_apply
  - name: exactly 120 minutes on the tarmac (food and water due)
    situation: { event.type: tarmac_delay, flight.touches_us: true, event.delay_minutes: 120 }
    outcome: applies
  - name: 121 minutes on the tarmac
    situation: { event.type: tarmac_delay, flight.touches_us: true, event.delay_minutes: 121 }
    outcome: applies
  - name: domestic flight, exactly 180 minutes
    situation: { event.type: tarmac_delay, flight.touches_us: true, flight.is_domestic_us: true, event.delay_minutes: 180 }
    outcome: applies
  - name: international flight, 239 minutes
    situation: { event.type: tarmac_delay, flight.touches_us: true, flight.is_domestic_us: false, event.delay_minutes: 239 }
    outcome: applies
  - name: international flight, exactly 240 minutes
    situation: { event.type: tarmac_delay, flight.touches_us: true, flight.is_domestic_us: false, event.delay_minutes: 240 }
    outcome: applies
  - name: flight does not touch the US
    situation: { event.type: tarmac_delay, flight.touches_us: false, event.delay_minutes: 200 }
    outcome: does_not_apply
  - name: whether the flight touches the US is not known yet
    situation: { event.type: tarmac_delay, event.delay_minutes: 200 }
    outcome: may_apply
    missing_facts: [flight.touches_us]
  - name: length of the delay not known yet
    situation: { event.type: tarmac_delay, flight.touches_us: true }
    outcome: may_apply
    missing_facts: [event.delay_minutes]
  - name: a delay at the gate is not a tarmac delay
    situation: { event.type: delay, flight.touches_us: true, event.delay_minutes: 200 }
    outcome: does_not_apply
  - name: event type not known yet
    situation: { flight.touches_us: true, event.delay_minutes: 200 }
    outcome: may_apply
    missing_facts: [event.type]
