  - name: "told 5 days before, rerouting arrives 100 minutes late, departure time of the offer not known"
    situation: { trip.journey_departs_eu: true, flight.departs_eu: true, flight.arrives_eu: false, flight.carrier_is_eu: false, flight.departs_iceland_norway_switzerland: false, trip.journey_arrives_eu: false, event.type: cancellation, event.cause: controllable, event.notice_days: 5, event.reroute_arrival_delay_minutes: 100 }
