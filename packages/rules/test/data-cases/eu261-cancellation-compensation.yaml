rule: eu261-cancellation-compensation
cases:
  - name: "told 13 days before departure, no rerouting offered"
    situation: { trip.journey_departs_eu: true, flight.departs_eu: true, flight.arrives_eu: false, flight.carrier_is_eu: false, flight.departs_iceland_norway_switzerland: false, trip.journey_arrives_eu: false, event.type: cancellation, event.cause: controllable, event.notice_days: 13, event.reroute_departs_early_minutes: 0, event.reroute_arrival_delay_minutes: 1440 }
    outcome: applies
  - name: "told exactly 14 days before departure (two weeks: no compensation)"
    situation: { trip.journey_departs_eu: true, flight.departs_eu: true, flight.arrives_eu: false, flight.carrier_is_eu: false, flight.departs_iceland_norway_switzerland: false, trip.journey_arrives_eu: false, event.type: cancellation, event.cause: controllable, event.notice_days: 14, event.reroute_departs_early_minutes: 0, event.reroute_arrival_delay_minutes: 1440 }
