    outcome: applies
  - name: "told 7 days before, rerouting arrives exactly 240 minutes late"
    situation: { trip.journey_departs_eu: true, flight.departs_eu: true, flight.arrives_eu: false, flight.carrier_is_eu: false, flight.departs_iceland_norway_switzerland: false, trip.journey_arrives_eu: false, event.type: cancellation, event.cause: controllable, event.notice_days: 7, event.reroute_departs_early_minutes: 120, event.reroute_arrival_delay_minutes: 240 }
    outcome: applies
  - name: "told 13 days before, rerouting leaves 60 minutes early and arrives 239 minutes late (within both limits)"
    situation: { trip.journey_departs_eu: true, flight.departs_eu: true, flight.arrives_eu: false, flight.carrier_is_eu: false, flight.departs_iceland_norway_switzerland: false, trip.journey_arrives_eu: false, event.type: cancellation, event.cause: controllable, event.notice_days: 13, event.reroute_departs_early_minutes: 60, event.reroute_arrival_delay_minutes: 239 }
    outcome: does_not_apply
  - name: "told 13 days before, rerouting leaves 121 minutes early"
    situation: { trip.journey_departs_eu: true, flight.departs_eu: true, flight.arrives_eu: false, flight.carrier_is_eu: false, flight.departs_iceland_norway_switzerland: false, trip.journey_arrives_eu: false, event.type: cancellation, event.cause: controllable, event.notice_days: 13, event.reroute_departs_early_minutes: 121, event.reroute_arrival_delay_minutes: 0 }
    outcome: applies
  - name: "told 13 days before, rerouting arrives 240 minutes late"
    situation: { trip.journey_departs_eu: true, flight.departs_eu: true, flight.arrives_eu: false, flight.carrier_is_eu: false, flight.departs_iceland_norway_switzerland: false, trip.journey_arrives_eu: false, event.type: cancellation, event.cause: controllable, event.notice_days: 13, event.reroute_departs_early_minutes: 0, event.reroute_arrival_delay_minutes: 240 }
    outcome: applies
  - name: "told 6 days before, rerouting leaves 60 minutes early and arrives 119 minutes late (within both limits)"
