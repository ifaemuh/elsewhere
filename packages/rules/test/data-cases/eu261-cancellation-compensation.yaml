    situation: { trip.journey_departs_eu: true, flight.departs_eu: true, flight.arrives_eu: false, flight.carrier_is_eu: false, flight.departs_iceland_norway_switzerland: false, trip.journey_arrives_eu: false, event.type: cancellation, event.cause: controllable, event.notice_days: 6, event.reroute_departs_early_minutes: 61, event.reroute_arrival_delay_minutes: 119 }
    outcome: applies
  - name: "told 6 days before, rerouting arrives exactly 120 minutes late"
    situation: { trip.journey_departs_eu: true, flight.departs_eu: true, flight.arrives_eu: false, flight.carrier_is_eu: false, flight.departs_iceland_norway_switzerland: false, trip.journey_arrives_eu: false, event.type: cancellation, event.cause: controllable, event.notice_days: 6, event.reroute_departs_early_minutes: 60, event.reroute_arrival_delay_minutes: 120 }
    outcome: applies
  - name: "told 6 days before, rerouting arrives 239 minutes late (fine only for the 7 to 14 day window)"
    situation: { trip.journey_departs_eu: true, flight.departs_eu: true, flight.arrives_eu: false, flight.carrier_is_eu: false, flight.departs_iceland_norway_switzerland: false, trip.journey_arrives_eu: false, event.type: cancellation, event.cause: controllable, event.notice_days: 6, event.reroute_departs_early_minutes: 0, event.reroute_arrival_delay_minutes: 239 }
