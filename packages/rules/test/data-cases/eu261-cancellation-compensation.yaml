    situation: { trip.journey_departs_eu: true, flight.departs_eu: true, flight.arrives_eu: false, flight.carrier_is_eu: false, flight.departs_iceland_norway_switzerland: false, trip.journey_arrives_eu: false, event.type: schedule_change, event.cause: controllable, event.departure_moved_earlier_minutes: 120, event.notice_days: 10, event.reroute_departs_early_minutes: 120, event.reroute_arrival_delay_minutes: 0 }
