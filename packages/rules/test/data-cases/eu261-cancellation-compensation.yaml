  - name: "Paris return, DL from CDG to JFK, told 2 days before"
    situation: { trip.journey_departs_eu: true, flight.departs_eu: true, flight.arrives_eu: false, flight.carrier_is_eu: false, flight.departs_iceland_norway_switzerland: false, trip.journey_arrives_eu: false, event.type: cancellation, event.cause: controllable, event.notice_days: 2, event.reroute_departs_early_minutes: 0, event.reroute_arrival_delay_minutes: 1440 }
