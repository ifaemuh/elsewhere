rule: us-dot-24-hour-cancellation
cases:
  - name: booked direct 10 hours ago, flying in 14 days
    situation: { flight.touches_us: true, trip.booked_via: direct, trip.hours_since_booking: 10, trip.hours_booked_before_departure: 336 }
    outcome: applies
  - name: exactly 24 hours since booking
    situation: { flight.touches_us: true, trip.booked_via: direct, trip.hours_since_booking: 24, trip.hours_booked_before_departure: 336 }
    outcome: applies
  - name: 25 hours since booking
    situation: { flight.touches_us: true, trip.booked_via: direct, trip.hours_since_booking: 25, trip.hours_booked_before_departure: 336 }
    outcome: does_not_apply
  - name: exactly 7 hours booked before departure
    situation: { flight.touches_us: true, trip.booked_via: direct, trip.hours_since_booking: 10, trip.hours_booked_before_departure: 168 }
    outcome: applies
  - name: 6 hours booked before departure
    situation: { flight.touches_us: true, trip.booked_via: direct, trip.hours_since_booking: 10, trip.hours_booked_before_departure: 144 }
    outcome: does_not_apply
  - name: booked through an online travel agency
    situation: { flight.touches_us: true, trip.booked_via: ota, trip.hours_since_booking: 10, trip.hours_booked_before_departure: 336 }
    outcome: does_not_apply
  - name: how it was booked is not known yet
    situation: { flight.touches_us: true, trip.hours_since_booking: 10, trip.hours_booked_before_departure: 336 }
    outcome: may_apply
    missing_facts: [trip.booked_via]
  - name: hours since booking not known yet
    situation: { flight.touches_us: true, trip.booked_via: direct, trip.hours_booked_before_departure: 336 }
    outcome: may_apply
    missing_facts: [trip.hours_since_booking]
  - name: hours booked before departure not known yet
    situation: { flight.touches_us: true, trip.booked_via: direct, trip.hours_since_booking: 10 }
    outcome: may_apply
    missing_facts: [trip.hours_booked_before_departure]
  - name: US airline flight between two foreign airports
    situation: { flight.touches_us: false, flight.carrier_is_us: true, trip.booked_via: direct, trip.hours_since_booking: 10, trip.hours_booked_before_departure: 336 }
    outcome: applies
  - name: foreign airline flight that does not touch the US
    situation: { flight.touches_us: false, flight.carrier_is_us: false, trip.booked_via: direct, trip.hours_since_booking: 10, trip.hours_booked_before_departure: 336 }
    outcome: does_not_apply
  - name: flight does not touch the US and the airline is not known yet
    situation: { flight.touches_us: false, trip.booked_via: direct, trip.hours_since_booking: 10, trip.hours_booked_before_departure: 336 }
    outcome: may_apply
    missing_facts: [flight.carrier_is_us]
