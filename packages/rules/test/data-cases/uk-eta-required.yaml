rule: uk-eta-required
cases:
  - name: US passport, trip to the UK
    situation: { trip.destination_country: GB, passenger.nationality: US }
    outcome: applies
  - name: Canadian passport, trip to the UK
    situation: { trip.destination_country: GB, passenger.nationality: CA }
    outcome: applies
  - name: Australian passport, trip to the UK
    situation: { trip.destination_country: GB, passenger.nationality: AU }
    outcome: applies
  - name: British passport, trip to the UK
    situation: { trip.destination_country: GB, passenger.nationality: GB }
    outcome: does_not_apply
  - name: Irish passport, trip to the UK
    situation: { trip.destination_country: GB, passenger.nationality: IE }
    outcome: does_not_apply
  - name: nationality not known yet
    situation: { trip.destination_country: GB }
    outcome: may_apply
    missing_facts: [passenger.nationality]
  - name: US passport, destination outside the UK
    situation: { trip.destination_country: FR, passenger.nationality: US }
    outcome: does_not_apply
  - name: destination not known yet
    situation: { passenger.nationality: US }
    outcome: may_apply
    missing_facts: [trip.destination_country]
