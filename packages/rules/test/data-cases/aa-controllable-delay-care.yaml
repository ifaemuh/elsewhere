rule: aa-controllable-delay-care
cases:
  - name: AA delay of 3 hours, AA's fault
    situation: { flight.carrier_iata: AA, event.type: delay, event.cause: controllable, event.delay_minutes: 180 }
    outcome: applies
  - name: AA delay of 179 minutes
    situation: { flight.carrier_iata: AA, event.type: delay, event.cause: controllable, event.delay_minutes: 179 }
    outcome: does_not_apply
  - name: AA cancellation, cause not said yet, long wait
    situation: { flight.carrier_iata: AA, event.type: cancellation, event.cause: unknown, event.delay_minutes: 600 }
    outcome: applies
  - name: AA delay, weather
    situation: { flight.carrier_iata: AA, event.type: delay, event.cause: uncontrollable, event.delay_minutes: 300 }
    outcome: does_not_apply
  - name: another carrier
    situation: { flight.carrier_iata: DL, event.type: delay, event.cause: controllable, event.delay_minutes: 300 }
    outcome: does_not_apply
  - name: missed connection is a different rule
    situation: { flight.carrier_iata: AA, event.type: missed_connection, event.cause: controllable, event.delay_minutes: 300 }
    outcome: does_not_apply
  - name: cause not known yet
    situation: { flight.carrier_iata: AA, event.type: delay, event.delay_minutes: 240 }
    outcome: may_apply
    missing_facts: [event.cause]
  - name: delay length not known yet
    situation: { flight.carrier_iata: AA, event.type: delay, event.cause: controllable }
    outcome: may_apply
    missing_facts: [event.delay_minutes]
  - name: carrier not known yet
    situation: { event.type: delay, event.cause: controllable, event.delay_minutes: 240 }
    outcome: may_apply
    missing_facts: [flight.carrier_iata]
