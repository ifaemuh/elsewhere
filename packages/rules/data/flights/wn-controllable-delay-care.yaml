id: wn-controllable-delay-care
version: 1
status: draft
domain: flights
jurisdiction: US-DOT
title: "Southwest delay or cancellation it caused, 3+ hours? Its plan promises rebooking, meals and sometimes a hotel"
summary: >-
  Southwest's Customer Service Plan promises care only when a delay of three hours or more, or a Southwest-initiated
  cancellation, is within Southwest's control (for example mechanical problems or an aircraft swap): rebooking at no
  additional cost, a meal voucher, and a hotel for an unplanned overnight. If weather or air traffic control caused it,
  the plan promises rebooking only.
applies_when:
  all:
    - fact: flight.carrier_iata
      eq: WN
    - fact: event.type
      in: [delay, cancellation]
    - fact: event.cause
      in: [controllable, unknown]
    - fact: event.delay_minutes
      gte: 180
entitlement:
  kind: care
  amount:
    rebooking: "next available Southwest flight(s) with seats available to your ticketed destination at no additional cost"
    meals: "a meal voucher upon request at the airport for participating vendors, or, if participating vendors or vouchers are not available, reimbursement of reasonable requests for meals purchased; owed for a delay within Southwest's control of three or more hours, or a Southwest-initiated cancellation within its control that results in a wait of three or more hours for a flight at the airport"
    lodging: "lodging arranged upon request if available, or reimbursement of reasonable requests for lodging (provided you do not reside locally); owed only if Southwest flight accommodations departing the same day to your intended destination or applicable co-terminal city are not available, resulting in an unscheduled overnight delay or stay when your itinerary did not originally include an overnight layover"
    ground_transportation: "a voucher upon request, or reimbursement of reasonable requests, if the lodging Southwest arranges does not provide shuttle service to and from the airport"
    luv_voucher: "a fully transferable Southwest LUV Voucher of at least $75 if Southwest canceled or delayed your flight within seven days of the scheduled departure, you arrived at your final destination three or more hours after the scheduled arrival time, and you request it at Southwest.com/DelayForm no later than one year after the flight"
  timing: "at the airport, on request"
how_to_claim:
  steps:
    - "Ask Southwest to rebook you on the next available Southwest flight to your ticketed destination at no additional cost."
    - "If your wait at the airport is three hours or more, ask for a meal voucher. If participating vendors or vouchers are not available, ask Southwest to reimburse reasonable meal purchases."
    - "If no same-day Southwest flight to your destination is available and you face an unplanned overnight stay that your original itinerary did not include, ask Southwest to arrange lodging, or to reimburse reasonable lodging costs if you do not live locally."
    - "If the lodging Southwest arranges has no airport shuttle, ask for a ground transportation voucher or reimbursement."
    - "If you arrive at your final destination three or more hours after the scheduled arrival time, request the Southwest LUV Voucher at Southwest.com/DelayForm within one year of the flight."
  templates: [airline_care_request]
exceptions:
  - "The care commitments (meals, lodging, ground transportation, LUV Voucher) depend on Southwest having caused the problem. For delays of three hours or more or cancellations not within Southwest's control (for example weather, Air Traffic Control, safety or security-related events, FAA-required crew duty limitations, infrastructure or utility problems), the plan promises rebooking on the next available Southwest flight at no additional cost, and nothing more."
  - "Lodging is only for an unscheduled overnight delay or stay when your itinerary did not originally include an overnight layover, only if same-day Southwest accommodations to your destination are not available, and only upon request. Lodging is arranged if available, and the reimbursement language covers you provided you do not reside locally."
  - "The LUV Voucher is only for a Southwest cancellation or delay within seven days of the scheduled departure when you arrive three or more hours late. A voucher already issued for the same delay or cancellation satisfies the commitment."
  - "Snacks and beverages are something Southwest 'may' provide, not a promise."
  - "The plan applies to flights operated by Southwest Airlines. It is not a contract. If it conflicts with the Contract of Carriage, the Contract of Carriage governs, and the Contract of Carriage says a refund to the original form of payment is your exclusive remedy for a Southwest cancellation or Significantly Delayed or Changed Flight."
sources:
  - id: s1
    source: wn-customer-service-plan
    quotes:
      - text: "For flight delays of three (3) hours or longer that are within our control or Southwest-initiated cancellations that arewithin our control (e.g., mechanical problems, aircraft swap), we will rebook you on the next available Southwestflight(s) with seats available to your ticketed destination at no additional cost."
        supports: [summary, applies_when, entitlement.amount.rebooking, how_to_claim.steps.0]
      - text: "During flight delays that are within ourcontrol of three (3) or more hours and/or Southwest-initiated cancellations that are within our control that result in await of three (3) or more hours for a flight at the airport, we will provide a meal voucher upon request at the airport forparticipating vendors within the airport or, if participating vendors and/or vouchers are not available, we will honorreasonable requests for reimbursement for meals purchased during such irregular operations."
        supports: [summary, applies_when, entitlement.amount.meals, how_to_claim.steps.1]
      - text: "Additionally, we mayprovide complimentary snacks and beverages for Customers."
        supports: [exceptions]
      - text: "If Southwest flight accommodations departing on the same day to your intended destination or applicable co-terminalcity are not available following a flight delay or Southwest-initiated cancellation that is within our control (e.g.,mechanical problems, aircraft swap), resulting in an unscheduled overnight delay or stay when your itinerary did notoriginally include an overnight layover, we will arrange lodging accommodations upon request if available, or will honorreasonable requests for reimbursement for lodging accommodations (provided you do not reside locally)."
        supports: [summary, entitlement.amount.lodging, exceptions, how_to_claim.steps.2]
      - text: "If the lodgingaccommodation we arrange does not provide shuttle service to/from the airport, we will offer a voucher upon request orhonor reasonable requests for reimbursement for ground transportation."
        supports: [entitlement.amount.ground_transportation, how_to_claim.steps.3]
      - text: "for significant flight delays or Southwest-initiated cancellations that arewithin our control, you may be eligible for a fully transferable Southwest LUV Voucher (of at least $75) if the followingconditions are met:"
        supports: [entitlement.amount.luv_voucher, exceptions]
      - text: "Southwest canceled and/or delayed your flight within seven days of the scheduled departure; and"
        supports: [entitlement.amount.luv_voucher, how_to_claim.steps.4, exceptions]
      - text: "You arrived at your final destination three or more hours after the scheduled arrival time; and"
        supports: [entitlement.amount.luv_voucher, how_to_claim.steps.4, exceptions]
      - text: "You submit a request for the Southwest LUV Voucher via Southwest.com/DelayForm no later than one (1) yearafter the flight in question."
        supports: [entitlement.amount.luv_voucher, how_to_claim.steps.4]
      - text: "If Southwest has already issued a voucher for a Customer for the same delay or cancellation, that satisfies Southwest’scommitment to issue the voucher"
        supports: [exceptions]
      - text: "For flight delays of three (3) hours or more or Southwest-initiated cancellations that are not within our control (e.g.,weather, Air Traffic Control, safety/security-related events, FAA-required crew duty limitations, infrastructure/utilityproblems), we will rebook you on the next available Southwest flight(s) with seats available to the Customer’s ticketeddestination at no additional cost."
        supports: [summary, exceptions]
      - text: "applies to flights operated by Southwest Airlines."
        supports: [applies_when, exceptions]
      - text: "is not a contract and does not create any contractual obligations on the part of the Carrier."
        supports: [exceptions]
      - text: "if there is any conflict between the language of the SWA CSP and the Southwest Airlines Contract of Carriage,the Contract of Carriage shall govern."
        supports: [exceptions]
  - id: s2
    source: wn-contract-of-carriage
    quotes:
      - text: "A refund to the original form of payment is your exclusive remedy in the event of aSouthwest cancellation or Significantly Delayed or Changed Flight"
        supports: [exceptions]
lead_character: capybara
tags: [delay, cancellation, care, meals, hotel, southwest, controllable]
