id: wn-controllable-delay-care
version: 1
status: verified
domain: flights
jurisdiction: "carrier:WN"
title: "Southwest caused your delay, cancellation or missed connection? Its plan commits to rebooking, a meal and maybe a hotel"
summary: >-
  If Southwest caused it (e.g. a mechanical problem), its Customer Service Plan commits to rebooking at no additional
  cost on the next Southwest flight with seats after a cancellation or 3+ hour delay, a meal voucher after a 3+ hour
  wait, and lodging if no same-day Southwest flight to your destination is available. For weather or Air Traffic
  Control delays it lists rebooking only.
applies_when:
  all:
    - fact: flight.marketing_carrier_iata
      eq: WN
    - fact: event.cause
      in: [controllable, unknown]
    - any:
        - all:
            - fact: event.type
              in: [delay]
            - fact: event.departure_delay_minutes
              gte: 180
        - all:
            - fact: event.type
              in: [cancellation]
            - fact: event.notice_days
              lte: 7
        - fact: event.type
          in: [missed_connection]
entitlement:
  kind: care
  amount:
    rebooking: "next available Southwest flight(s) with seats available to your ticketed destination at no additional cost; owed for a delay within Southwest's control of three hours or longer or a Southwest-initiated cancellation within its control. For a missed connection, the flight Southwest delayed must have been three or more hours late"
    meals: "a meal voucher upon request at the airport for participating vendors, or, if participating vendors or vouchers are not available, reimbursement of reasonable requests for meals purchased; owed for a delay within Southwest's control of three or more hours, or a Southwest-initiated cancellation within its control that results in a wait of three or more hours for a flight at the airport. For a missed connection, the flight Southwest delayed must have been three or more hours late"
    lodging: "lodging arranged upon request if available, or reimbursement of reasonable requests for lodging (provided you do not reside locally); owed only if Southwest flight accommodations departing the same day to your intended destination or applicable co-terminal city are not available following a delay or Southwest-initiated cancellation within its control, resulting in an unscheduled overnight delay or stay when your itinerary did not originally include an overnight layover. No hours threshold is stated"
    ground_transportation: "a voucher upon request, or reimbursement of reasonable requests, if the lodging Southwest arranges does not provide shuttle service to and from the airport"
    luv_voucher: "you may be eligible for a fully transferable Southwest LUV Voucher of at least $75 if Southwest canceled or delayed your flight within seven days of the scheduled departure, you arrived at your final destination three or more hours after the scheduled arrival time, and you request it at Southwest.com/DelayForm no later than one year after the flight"
  timing: "rebooking, meal, lodging and ground transportation on request at the airport; the LUV Voucher by request at Southwest.com/DelayForm within one year of the flight"
how_to_claim:
  steps:
    - "Ask Southwest to rebook you on the next available Southwest flight to your ticketed destination at no additional cost."
    - "If you are waiting three or more hours at the airport, ask for a meal voucher. If participating vendors or vouchers are not available, ask Southwest to reimburse reasonable meal purchases."
    - "If no same-day Southwest flight to your destination is available and you face an unplanned overnight stay that your original itinerary did not include, ask Southwest to arrange lodging, or to honor a reasonable request for reimbursement for lodging."
    - "If the lodging Southwest arranges has no airport shuttle, ask for a ground transportation voucher or reimbursement."
    - "If you arrive at your final destination three or more hours after the scheduled arrival time, request the Southwest LUV Voucher at Southwest.com/DelayForm within one year of the flight."
    - "If you believe an airline has not fulfilled its commitment, contact the airline first to ensure it gives you what is owed."
  templates: [airline_care_request]
exceptions:
  - "These commitments depend on Southwest having caused the problem. For a delay of three hours or more or a cancellation that is not within Southwest's control (for example weather, Air Traffic Control, safety or security-related events, FAA-required crew duty limitations, infrastructure or utility problems), the plan lists only rebooking on the next available Southwest flight at no additional cost."
  - "Staffing shortages may not count as Southwest's fault. The Contract of Carriage treats as outside Southwest's control, among other things, labor-related disputes affecting Southwest's service, an inability to obtain fuel, supplies, parts, airport gates, labor or landing facilities, and any fact or situation Southwest did not foresee, and it lists a lack of sufficient materials, staffing or supplies among the safety reasons it may cancel or delay a flight."
  - "For a cancellation, the meal applies when the cancellation results in a wait of three or more hours for a flight at the airport. For a missed connection, rebooking and the meal apply when the flight Southwest delayed was three or more hours late, and lodging has no hours threshold. The plan does not mention missed connections by name, and the Contract of Carriage says Southwest does not guarantee that you will make connections to other flights, whether operated by Southwest or another airline."
  - "Lodging is arranged upon request if available, or Southwest will honor reasonable requests for reimbursement for lodging, and the plan adds 'provided you do not reside locally'. It applies only after a delay or cancellation within Southwest's control that leaves no same-day Southwest flight to your destination and causes an unscheduled overnight delay or stay when your itinerary did not originally include an overnight layover."
  - "Unless Southwest provides it at its direction, the Contract of Carriage says Southwest does not assume responsibility for ground transportation between its airports and any other location, and that ground transportation is at your expense."
  - "The LUV Voucher is something you 'may be eligible' for. The Contract of Carriage says a LUV Voucher is issued at Southwest's sole discretion in a specified dollar amount with a specified expiration date, and is redeemable only for the purchase of tickets, not for cash. It is only for a Southwest cancellation or delay within seven days of the scheduled departure when you arrive three or more hours late. A voucher already issued for the same delay or cancellation satisfies the commitment."
  - "Snacks and beverages are something Southwest 'may' provide, not a promise."
  - "These services don't cover itinerary changes Southwest makes more than seven days before departure."
  - "The plan covers flights operated by Southwest Airlines. Southwest says the plan is not a contract, but federal rules require it to adhere to the plan's terms."
  - "Rebooking is promised on Southwest flights only, and the Contract of Carriage words it as Southwest 'may offer' to transport you on the next Southwest flight on which space is available. Carriage on another airline is governed by that airline's contract or conditions of carriage."
sources:
  - id: s1
    source: wn-customer-service-plan
    quotes:
      - text: "For flight delays of three (3) hours or longer that are within our control or Southwest-initiated cancellations that arewithin our control (e.g., mechanical problems, aircraft swap), we will rebook you on the next available Southwestflight(s) with seats available to your ticketed destination at no additional cost."
        supports: [summary, applies_when, entitlement.amount.rebooking, how_to_claim.steps.0]
      - text: "During flight delays that are within ourcontrol of three (3) or more hours and/or Southwest-initiated cancellations that are within our control that result in await of three (3) or more hours for a flight at the airport, we will provide a meal voucher upon request at the airport forparticipating vendors within the airport or, if participating vendors and/or vouchers are not available, we will honorreasonable requests for reimbursement for meals purchased during such irregular operations."
        supports: [summary, applies_when, entitlement.amount.meals, how_to_claim.steps.1]
      - text: "Additionally, we mayprovide complimentary snacks and beverages for Customers."
        supports: [exceptions]
      - text: "If Southwest flight accommodations departing on the same day to your intended destination or applicable co-terminalcity are not available following a flight delay or Southwest-initiated cancellation that is within our control (e.g.,mechanical problems, aircraft swap), resulting in an unscheduled overnight delay or stay when your itinerary did notoriginally include an overnight layover, we will arrange lodging accommodations upon request if available, or will honorreasonable requests for reimbursement for lodging accommodations (provided you do not reside locally)."
        supports: [summary, entitlement.amount.lodging, exceptions, how_to_claim.steps.2]
      - text: "If the lodgingaccommodation we arrange does not provide shuttle service to/from the airport, we will offer a voucher upon request orhonor reasonable requests for reimbursement for ground transportation."
        supports: [entitlement.amount.ground_transportation, how_to_claim.steps.3]
      - text: "for significant flight delays or Southwest-initiated cancellations that arewithin our control, you may be eligible for a fully transferable Southwest LUV Voucher (of at least $75) if the followingconditions are met:"
        supports: [entitlement.amount.luv_voucher, exceptions]
      - text: "Southwest canceled and/or delayed your flight within seven days of the scheduled departure; and"
        supports: [entitlement.amount.luv_voucher, how_to_claim.steps.4, exceptions]
      - text: "You arrived at your final destination three or more hours after the scheduled arrival time; and"
        supports: [entitlement.amount.luv_voucher, how_to_claim.steps.4, exceptions]
      - text: "You submit a request for the Southwest LUV Voucher via Southwest.com/DelayForm no later than one (1) yearafter the flight in question."
        supports: [entitlement.amount.luv_voucher, how_to_claim.steps.4]
      - text: "If Southwest has already issued a voucher for a Customer for the same delay or cancellation, that satisfies Southwest’scommitment to issue the voucher"
        supports: [exceptions]
      - text: "For flight delays of three (3) hours or more or Southwest-initiated cancellations that are not within our control (e.g.,weather, Air Traffic Control, safety/security-related events, FAA-required crew duty limitations, infrastructure/utilityproblems), we will rebook you on the next available Southwest flight(s) with seats available to the Customer’s ticketeddestination at no additional cost."
        supports: [summary, exceptions]
      - text: "applies to flights operated by Southwest Airlines."
        supports: [applies_when, exceptions]
      - text: "is not a contract and does not create any contractual obligations on the part of the Carrier."
        supports: [exceptions]
      - text: "Notifying Customers in a timely manner of changes in travel itineraries (more than seven days from departure)"
        supports: [applies_when, exceptions]
      - text: "The servicesdescribed here do not apply to changes in travel itineraries referenced in Section 11."
        supports: [applies_when, exceptions]
  - id: s2
    source: wn-contract-of-carriage
    quotes:
      - text: "Southwest does not guarantee that aPassenger will make connections to other flights, whether operated by Southwest or anotherairline."
        supports: [exceptions]
      - text: "Southwest may offer to transport the Passenger at no additional charge on the nextSouthwest Airlines flight(s)"
        supports: [exceptions]
      - text: "Unless provided at the direction of Southwest, Southwest does not assume responsibilityfor the ground transportation of any Passenger or his or her Baggage between any Airportused by Southwest and any other location."
        supports: [exceptions]
      - text: "Ground Transportation is at the Passenger’sexpense."
        supports: [exceptions]
      - text: "or any other labor related dispute involving or affecting Southwest’sservice"
        supports: [exceptions]
      - text: "theinability to obtain fuel, supplies, components, parts, fluids, airport gates, labor, landingfacilities"
        supports: [exceptions]
      - text: "or any fact or situation that was not foreseen, anticipated,or predicted by Southwest."
        supports: [exceptions]
      - text: "the lack of sufficient materials, staffing, or supplies for a flight to beoperated."
        supports: [exceptions]
      - text: "Southwest LUV Voucher means a voucher issued by Southwest, at Southwest’s solediscretion in a specified dollar amount with a specified expiration date."
        supports: [exceptions]
      - text: "Southwest LUVVouchers are redeemable solely for the purchase of Tickets and may not be redeemed forcash."
        supports: [exceptions]
      - text: "Carriage on any Interline Carrier is governed by the Interline Carrier’s contract orconditions of carriage."
        supports: [exceptions]
  - id: s3
    source: ecfr-14-cfr-259
    quotes:
      - text: "Each covered carrier must adopt a Customer Service Plan applicable to its scheduled flights as specified in paragraphs (b)(1) through (14) of this section and adhere to the plan's terms."
        supports: [exceptions]
  - id: s4
    source: dot-customer-service-dashboard
    quotes:
      - text: "If you believe an airline has not fulfilled its commitment, contact the airline first to ensure it gives you what is owed."
        supports: [how_to_claim.steps.5]
