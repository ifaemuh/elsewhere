id: aa-controllable-delay-care
version: 1
status: draft
domain: flights
jurisdiction: carrier:AA
title: "American Airlines delayed or cancelled your flight? If it's their doing, ask for a meal credit, hotel and transport"
summary: >-
  American's customer service plan says that when American causes a delay or cancellation, it gives you on request a food
  credit if the delay is 3 or more hours, and a hotel voucher plus transport if you are delayed overnight away from home.
  Nothing is promised if the cause is beyond American's control, like weather.
applies_when:
  all:
    - fact: flight.carrier_iata
      eq: AA
    - fact: event.type
      in: [delay, cancellation]
    - fact: event.cause
      in: [controllable, unknown]
    - fact: event.delay_minutes
      gte: 180
entitlement:
  kind: care
  amount:
    meal: "Food / beverage credit if your delay is 3 or more hours after your scheduled departure"
    hotel: "A voucher for an approved hotel with available rooms if you are delayed overnight if you’re away from your city of residence"
    transport: "Transportation to a hotel and back to the airport by hotel shuttle / third-party transportation service, or a transportation voucher"
    fallback: "If no hotel voucher or transportation voucher can be provided, American reimburses reasonable hotel costs or reasonable transportation costs"
  timing: "Upon request, when the delay or cancellation is caused by American Airlines"
how_to_claim:
  steps:
    - "Ask American Airlines staff at the airport for the food credit, hotel voucher and transportation. The plan says they are given upon request."
    - "If you're delayed overnight, ask American for an approved hotel before you book your own. American doesn't guarantee reimbursement for a hotel you book directly without its written authorization."
    - "If American can't give you a hotel voucher or a transportation voucher, ask for reimbursement of reasonable hotel or transportation costs."
  templates: [airline_care_request]
exceptions:
  - "Only when the delay or cancellation is caused by American. If it is caused by events beyond American's control (like weather), you are responsible for your own overnight accommodations, meals and incidental expenses, though American agents may be able to help you find a hotel."
  - "The food credit applies if your delay is 3 or more hours after your scheduled departure. The hotel voucher applies if you are delayed overnight and away from your city of residence. The 3-hour threshold in this rule is the food credit's; the plan sets no hour count for the hotel, so an overnight delay shorter than 3 hours is not covered by this rule's check."
  - "If you are diverted to another city, the plan has a separate commitment (a hotel voucher if American doesn't board you to your final destination before 11:59 p.m., and a food credit if you're delayed more than 3 hours there). It is not covered by this rule."
  - "On a codeshare flight operated by another airline, check with that airline."
  - "The contract of carriage says that if the delay is beyond American's control, or you book your own arrangements without written authorization from American Airlines, you're responsible to pay for your hotel, meals and other expenses."
sources:
  - id: s1
    source: aa-customer-service-plan
    quotes:
      - text: "In cases where a delay or cancellation is caused by us, upon request we’ll give you:"
        supports: [summary, applies_when, entitlement.timing, how_to_claim.steps.0]
      - text: "A voucher for an approved hotel with available rooms if you are delayed overnight if you’re away from your city of residence."
        supports: [summary, entitlement.amount, exceptions]
      - text: "Transportation to a hotel and back to the airport by hotel shuttle / third-party transportation service, or a transportation voucher."
        supports: [summary, entitlement.amount]
      - text: "Food / beverage credit if your delay is 3 or more hours after your scheduled departure."
        supports: [summary, applies_when, entitlement.amount, exceptions]
      - text: "If we can’t provide you with a voucher for an approved hotel, we’ll reimburse you for reasonable hotel costs. If a hotel shuttle / third-party transportation service isn’t available, or we can’t provide you with a transportation voucher, we’ll reimburse you for reasonable transportation costs."
        supports: [entitlement.amount, how_to_claim.steps.2]
      - text: "If the delay or cancellation is caused by events beyond our control (like weather), you are responsible for your own overnight accommodations, meals and incidental expenses. American Airlines agents may be able to help you find a hotel."
        supports: [summary, applies_when, exceptions]
      - text: "If your flight is diverted to another city and we don’t board to your final destination before 11:59 p.m., we’ll give you:"
        supports: [exceptions]
      - text: "Food / beverage credit if you are delayed in the diversion city for more than 3 hours."
        supports: [exceptions]
  - id: s2
    source: aa-contract-of-carriage
    quotes:
      - text: "We don’t guarantee reimbursement for hotel expenses if you book directly without written authorization from American Airlines."
        supports: [how_to_claim.steps.1, exceptions]
      - text: "If the delay is beyond our control, or you book your own arrangements without written authorization from American Airlines, you're responsible to pay for your hotel, meals and other expenses."
        supports: [exceptions]
      - text: "If you're on a codeshare flight operated by one of our partners, check with that airline."
        supports: [exceptions]
lead_character: capybara
tags: [delay, cancellation, hotel, meal, care, american-airlines]
last_verified: null
verified_by: null
review_by: null
history:
  - { version: 1, status: draft, date: 2026-10-05 }
