id: dl-missed-connection-rebooking
version: 1
status: draft
domain: flights
jurisdiction: "carrier:DL"
title: "Missed a connection on Delta? Delta says it will rebook you at no additional cost"
summary: >-
  When you misconnect, Delta's Customer Service Plan says it will rebook you on the next available Delta flight at no
  additional cost, or on another airline it has a ticketing agreement with if no Delta flight is available. The plan does
  not make this depend on the cause.
applies_when:
  all:
    - fact: flight.marketing_carrier_iata
      eq: DL
    - fact: flight.touches_us
      eq: true
    - fact: event.type
      in: [missed_connection]
    - fact: flight.single_ticket
      eq: true
entitlement:
  kind: rebooking
  amount:
    first_choice: "rebooking on the next available flight on Delta at no additional cost"
    if_no_delta_flight: "an alternative flight operated by another airline with which Delta has a ticketing agreement, at no additional cost"
    baggage: "Delta will make every reasonable effort to reroute your checked baggage on the same flight as you"
how_to_claim:
  steps:
    - "Go to a Delta agent at the airport or contact Delta right away and say you have misconnected and need to be rebooked."
    - "Ask to be put on the next available Delta flight to your destination at no additional cost. If no Delta flight is available, ask for a flight on another airline with which Delta has a ticketing agreement."
    - "Ask that your checked baggage be rerouted onto the same flight as you."
    - "If you believe an airline has not fulfilled its commitment, contact the airline first to ensure it gives you what is owed."
  templates: []
exceptions:
  - "The plan applies to Delta's covered flights operating to, from, or within the U.S. Delta's Conditions of Carriage say their terms apply to flights operated by the Delta Connection and Delta Shuttle carriers, and to codeshare flights marketed by Delta. For interline flights operated by other carriers, the conditions of carriage of the operating carrier apply."
  - "If your connection is on a separate ticket, the plan doesn't say Delta will rebook it. Delta says combining separate one-way tickets increases the likelihood of missed connections."
  - "Delta's Domestic Conditions of Carriage, which apply only to travel entirely within the United States, say Delta is not responsible or liable for making connections. That limits Delta's liability, but the plan still promises rebooking. The contract also says that after a change that will cause a passenger to miss connections, Delta will refund the unused ticket and unused ancillary fees if the passenger asks, if Delta does not offer an alternative flight or voucher option, or if the passenger does not respond to the offer prior to the originally scheduled departure time. Otherwise it will transport you on its next flight with seats available in the class of service you bought."
  - "Under the Conditions of Carriage, travel on another carrier or by ground transportation is at Delta's sole discretion and only if acceptable to you, and Delta may offer a lower class of service. The plan commits more: if a Delta flight is unavailable, Delta says it will arrange an alternative flight operated by another airline with which it has a ticketing agreement at no additional cost."
  - "Federal rules require a carrier to adopt a Customer Service Plan and adhere to the plan's terms, so the plan is what Delta has committed to."
sources:
  - id: s1
    source: dl-customer-service-plan
    quotes:
      - text: "The Delta Air Lines Customer Service Plan applies to our covered flights operating to, from, or within the U.S."
        supports: [applies_when, exceptions]
      - text: "When your flight has been significantly delayed, cancelled, or you have misconnected, we will rebook you on the next available flight on Delta at no additional cost."
        supports: [summary, applies_when, entitlement.amount, how_to_claim.steps.0, how_to_claim.steps.1, exceptions]
      - text: "If a Delta flight is unavailable, we will arrange an alternative flight operated by another airline with which we have a ticketing agreement at no additional cost."
        supports: [summary, entitlement.amount, how_to_claim.steps.1]
      - text: "We will make every reasonable effort to reroute your checked baggage on the same flight as you."
        supports: [entitlement.amount, how_to_claim.steps.2]
      - text: "because this increases the likelihood that you could experience customer service failures such as lost baggage and missed connections."
        supports: [exceptions]
  - id: s2
    source: dl-contract-of-carriage
    quotes:
      - text: "Delta is not responsible or liable for making connections"
        supports: [exceptions]
      - text: "(i) at passenger’s request, (ii) if Delta does not offer an alternative flight or voucher option, or (iii) if the passenger does not respond to the offer on an alternative flight or voucher option prior to the originally scheduled departure time: cancel the remaining ticket and refund the unused portion of the ticket and unused ancillary fees"
        supports: [exceptions]
      - text: "If the passenger does not request cancellation and refund of the remaining portion of the ticket, Delta will transport the passenger to the destination on Delta’s next flight on which seats are available in the class of service originally purchased."
        supports: [exceptions]
      - text: "At Delta’s sole discretion and if acceptable to the passenger, Delta may arrange for the passenger to travel on another Carrier or via ground transportation. If acceptable to the passenger, Delta may provide transportation in a lower class of service, in which case the passenger may be entitled to a partial refund."
        supports: [exceptions]
      - text: "This document is Delta's Domestic Conditions of Carriage. It applies only to travel entirely within the United States of America"
        supports: [exceptions]
      - text: "The terms of transportation applicable to Delta specified in these Conditions of Carriage apply to flights operated by the Delta Connection and Delta Shuttle carriers, and to codeshare flights marketed by Delta."
        supports: [applies_when, exceptions]
      - text: "For interline flights operated by other Carriers, the conditions of carriage of the operating Carrier will apply."
        supports: [exceptions]
  - id: s3
    source: ecfr-14-cfr-259
    quotes:
      - text: "Each covered carrier must adopt a Customer Service Plan applicable to its scheduled flights as specified in paragraphs (b)(1) through (14) of this section and adhere to the plan's terms."
        supports: [exceptions]
  - id: s4
    source: dot-customer-service-dashboard
    quotes:
      - text: "DOT will hold airlines accountable if they fail to fulfill a customer service commitment. If you believe an airline has not fulfilled its commitment, contact the airline first to ensure it gives you what is owed."
        supports: [how_to_claim.steps.3]
lead_character: capybara
tags: [delta, missed-connection, misconnect, rebooking]
