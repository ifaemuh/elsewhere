id: us-dot-refund-service-not-provided
version: 1
status: draft
domain: flights
jurisdiction: US-DOT
title: "Paid for a seat, Wi-Fi or another extra you didn't get? The airline owes you a refund"
summary: >-
  If you paid an airline a fee for an ancillary service on a flight to, from or within the US, such as a seat, Wi-Fi, a
  meal or lounge access, and it wasn't provided through no fault of yours, the airline must promptly refund the fee to
  your original form of payment.
applies_when:
  all:
    - fact: event.type
      in: [service_not_provided]
    - fact: flight.touches_us
      eq: true
entitlement:
  kind: refund
  amount:
    refund: the fee you paid for the ancillary service that was not provided
    form: original form of payment unless you agree to a cash equivalent
    processing_fee_retained: false
  timing: "within 7 business days for credit card purchases, within 20 calendar days for cash, check, debit card or other forms of purchase, counted from the earliest date the refund was requested as set forth in 14 CFR 260.6(a)(2)"
how_to_claim:
  steps:
    - "Tell the airline that operated the flight which paid service you did not get."
    - "If the refund doesn't arrive on its own, ask the airline for a refund of that fee in writing. If you booked through a ticket agent, ask the agent."
    - "Check that the money returns to your original form of payment, within 7 business days for a credit card or 20 calendar days for other payments."
  templates: [airline_refund_request]
exceptions:
  - "Only for a service that was not provided through no fault of the consumer."
  - "When the service failed for you or a few passengers rather than everyone who paid for it, the airline's duty to refund begins when you notify the operating airline and it confirms that the service was not provided. Your notice counts as a refund request."
  - "When the service was unavailable to all passengers who paid for it, the airline's duty to refund begins when it knows the service is unavailable."
  - "Checked bag fees follow a separate rule: the bag must be lost or significantly delayed and you must file a Mishandled Baggage Report."
  - "The regulation puts the duty on the covered carrier that is the merchant of record, or, when a ticket agent is the merchant of record, on the carrier that operated the flight and failed to provide the service. Rules matching does not check who the merchant of record is."
sources:
  - id: s1
    source: ecfr-14-cfr-260
    quotes:
      - text: "A covered carrier that is the merchant of record shall provide a prompt and automatic refund to a consumer for any fees it collected from the consumer for ancillary services if the service was not provided through no fault of the consumer (e.g., prepaid ancillary service not utilized by the consumer because of flight cancellation, significant change, or oversale situation; service not provided because of aircraft substitution, equipment malfunction, etc.)."
        supports: [summary, applies_when, entitlement.amount, exceptions]
      - text: "If a ticket agent is the merchant of record for fees for all other ancillary services, the carrier that operated the flight and failed to provide the service through no fault of the consumer is responsible for providing a prompt and automatic refund."
        supports: [exceptions, how_to_claim.steps.1]
      - text: "any optional service related to air travel that a covered carrier provides for a fee, beyond passenger air transportation. Such services may include, but are not limited to, transport of checked or carry-on baggage, advance seat selection, access to in-flight entertainment programs or Wi-Fi, in-flight beverages, snacks, meals, pillows and blankets, seat upgrades, and lounge access."
        supports: [summary, applies_when]
      - text: "Covered carrier means an air carrier or a foreign air carrier operating to, from, or within the United States, conducting scheduled passenger service."
        supports: [applies_when]
      - text: "a carrier's obligation under paragraph (a) of this section to provide a prompt and automatic refund begins when the information about the unavailability of the service is known by the carrier that failed to provide the service"
        supports: [exceptions]
      - text: "a carrier's obligation under paragraph (a) of this section to provide a prompt and automatic refund begins when the consumer affected by the service failure notifies the operating carrier that failed to provide the ancillary service about the unavailability of the service and that information has been confirmed"
        supports: [exceptions, how_to_claim.steps.0]
      - text: "Notification of the unavailability of the ancillary service by a consumer is considered a request for a refund."
        supports: [exceptions, how_to_claim.steps.0]
      - text: "Prompt refund means refunds made within 7 business days after the earliest date the refund was requested as set forth in § 260.6(a)(2) as required by 14 CFR 374.3 for credit card purchases and within 20 calendar days after the earliest date the refund was requested as set forth in § 260.6(a)(2) for cash, check, debit card, or other forms of purchases."
        supports: [entitlement.timing, how_to_claim.steps.2]
      - text: "the refund must be issued promptly in the original form of payment (i.e., money is returned to an individual using whatever payment method the individual used to make the original payment, such as a check, credit card, debit card, cash, or airline miles) unless the consumer agrees to receive the refunds in a different form of payment that is a cash equivalent as defined in § 260.2."
        supports: [entitlement.amount, how_to_claim.steps.2]
      - text: "Carriers may not retain a processing fee for issuing refunds that are due."
        supports: [entitlement.amount]
lead_character: pigeon
tags: [refund, ancillary-fees, seat, wifi, dot]
