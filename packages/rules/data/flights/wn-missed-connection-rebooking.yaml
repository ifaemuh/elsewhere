id: wn-missed-connection-rebooking
version: 1
status: draft
domain: flights
jurisdiction: US-DOT
title: "Missed a Southwest connection after a delay of 3+ hours? Its plan says it rebooks you at no extra cost"
summary: >-
  Southwest's Customer Service Plan promises to rebook you on the next available Southwest flight with seats to your
  ticketed destination at no additional cost when a delay is three hours or more, whether or not Southwest caused it.
  The Contract of Carriage separately says Southwest does not guarantee that you will make connections.
applies_when:
  all:
    - fact: flight.carrier_iata
      eq: WN
    - fact: event.type
      in: [missed_connection]
    - fact: flight.single_ticket
      eq: true
    - fact: event.delay_minutes
      gte: 180
entitlement:
  kind: rebooking
  amount:
    rebooking: "next available Southwest flight(s) with seats available to your ticketed destination at no additional cost"
    partner_airlines: "not promised; the plan and the Contract of Carriage offer Southwest flights or alternative transportation on Southwest Airlines"
  timing: "next available Southwest flight with seats available"
how_to_claim:
  steps:
    - "Ask Southwest to rebook you on the next available Southwest flight with seats to your ticketed destination, at no additional cost."
    - "If your ticket includes another airline, check that airline's own contract of carriage for its flights, because carriage on another airline is governed by that airline's contract."
  templates: []
exceptions:
  - "The Contract of Carriage says Southwest does not guarantee that you will make connections to other flights, whether operated by Southwest or another airline."
  - "Southwest's contract says it 'may' offer to transport you at no additional charge on the next Southwest flight on which space is available, in accordance with its established re-accommodation practices."
  - "The plan promises rebooking on a Southwest flight. It does not mention rebooking on another airline."
  - "The commitment is stated for a delay of three hours or longer. The plan makes the rebooking promise whether or not the delay is within Southwest's control."
  - "The plan applies to flights operated by Southwest Airlines. It is not a contract. If it conflicts with the Contract of Carriage, the Contract of Carriage governs."
  - "On a ticket that includes another airline, carriage on that airline is governed by that airline's contract or conditions of carriage. The Southwest-operated flight stays governed by the Southwest Contract of Carriage, though Southwest may apply the other airline's rules on reservation changes, cancellations and refunds."
sources:
  - id: s1
    source: wn-customer-service-plan
    quotes:
      - text: "For flight delays of three (3) hours or longer that are within our control or Southwest-initiated cancellations that arewithin our control (e.g., mechanical problems, aircraft swap), we will rebook you on the next available Southwestflight(s) with seats available to your ticketed destination at no additional cost."
        supports: [summary, applies_when, entitlement.amount.rebooking, entitlement.timing, how_to_claim.steps.0, exceptions]
      - text: "For flight delays of three (3) hours or more or Southwest-initiated cancellations that are not within our control (e.g.,weather, Air Traffic Control, safety/security-related events, FAA-required crew duty limitations, infrastructure/utilityproblems), we will rebook you on the next available Southwest flight(s) with seats available to the Customer’s ticketeddestination at no additional cost."
        supports: [summary, applies_when, entitlement.amount.rebooking, exceptions]
      - text: "applies to flights operated by Southwest Airlines."
        supports: [applies_when, exceptions]
      - text: "is not a contract and does not create any contractual obligations on the part of the Carrier."
        supports: [exceptions]
      - text: "if there is any conflict between the language of the SWA CSP and the Southwest Airlines Contract of Carriage,the Contract of Carriage shall govern."
        supports: [exceptions]
  - id: s2
    source: wn-contract-of-carriage
    quotes:
      - text: "Southwest does not guarantee that aPassenger will make connections to other flights, whether operated by Southwest or anotherairline."
        supports: [summary, exceptions]
      - text: "Southwest may offer to transport the Passenger at no additional charge on the nextSouthwest Airlines flight(s) on which space is available to the Passenger’s intendeddestination or provide alternative transportation on Southwest Airlines (subject toavailability) in accordance with its established re-accommodation practices"
        supports: [entitlement.amount.partner_airlines, exceptions]
      - text: "Carriage on any Interline Carrier is governed by the Interline Carrier’s contract orconditions of carriage."
        supports: [exceptions, how_to_claim.steps.1]
      - text: "transportation on the Southwest-operated flight is governed by this Contract of Carriage,but Southwest may apply rules and policies of the Interline Carrier in the following areas:"
        supports: [exceptions]
      - text: "Reservation changes, cancellations, and refunds; and"
        supports: [exceptions]
lead_character: capybara
tags: [missed-connection, rebooking, southwest, delay]
last_verified: null
verified_by: null
review_by: null
history:
  - { version: 1, status: draft, date: 2026-10-05 }
