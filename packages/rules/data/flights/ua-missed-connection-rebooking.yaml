id: ua-missed-connection-rebooking
version: 1
status: draft
domain: flights
jurisdiction: "carrier:UA"
title: "Missed a connection on a United ticket? United's plan: its next flight with seats in your cabin, no extra cost"
summary: >-
  If you miss a connection on one ticket with United, United's Customer Commitment says it will get you on the next
  flight it has with available seats in your cabin at no additional cost. If the disruption is within United's control
  and no United flight is available until the next day, you can ask to be booked on a partner airline.
applies_when:
  all:
    - fact: flight.marketing_carrier_iata
      eq: UA
    - fact: event.type
      in: [missed_connection]
    - fact: flight.single_ticket
      eq: true
entitlement:
  kind: rebooking
  amount:
    rebooking: "the next flight United has with available seats in the same cabin you're traveling in, at no additional cost"
    partner_airline_next_day: "if your same-day cancellation or delay is caused by something within United's control and a United flight is unavailable until the next day, ask and United will book you on a partner airline's flight via its existing interline agreements at no additional cost if they have seats available for United customers in your ticketed cabin"
  timing: "The sources give no deadline. Ask the airline as soon as you know you've missed the connection."
how_to_claim:
  steps:
    - "Ask United about your rebooking options at united.com, in the United app, at an airport kiosk, or through an airport or contact center agent."
    - "Ask to be put on the next United flight with available seats in your cabin, at no additional cost."
    - "If your same-day delay or cancellation is within United's control and United has no flight until the next day, ask United to book you on a partner airline's flight."
    - "If you believe United has not fulfilled its commitment, contact United first to ensure it gives you what is owed."
  templates: []
exceptions:
  - "The contract lists what it counts as beyond United's control (a Force Majeure Event): conditions beyond its control such as weather, acts of God, riots, terrorist activity, wars; any strike, work stoppage, slowdown, lockout or other labor-related dispute affecting United's services; any governmental regulation, demand or requirement; any shortage of labor, fuel, or facilities of United or others; damage to United's aircraft or equipment caused by another party; any emergency situation requiring immediate care or protection for a person or property; and any event not reasonably foreseen, anticipated or predicted by United. Under this list, a staffing shortage or an unforeseen event may not count as United's fault, so the care commitment may not apply."
  - "The contract of carriage's rebooking measures apply 'because of Irregular Operations caused by UA'. For a Force Majeure Event it says United 'may re-accommodate Passengers on another available UA flight or on another carrier or combination of carriers, or via ground transportation, or may refund, in its sole discretion, any unused portions of the Ticket in the form of a travel certificate or travel credit.'"
  - "If the first flight is cancelled, whatever the cause, the contract says 'the Delivering Carrier is responsible to arrange for carriage of the Passenger or to make a refund'."
  - "The contract says that 'At its sole discretion, UA may arrange for the passenger to travel on another carrier.' United's plan commits to more: the partner-airline booking described above when the conditions are met."
  - "If space is only available and used on a UA flight of a lower class of service than you bought, the contract says United 'will provide a refund of the difference in fare pursuant to Rule 27 C) 5)'."
  - "United's plan says you can get a refund of your fare and any fees if your flight is significantly disrupted or oversold and you choose not to accept its rebooking options or other compensation. Significantly disrupted flights include flights with a schedule change or delay of at least 3 hours domestically, or 6 hours internationally. Refunds go to your original form of payment, minus any applicable fees."
  - "If your connection is on a separate ticket, United's plan doesn't say United will rebook it."
  - "For a flight starting outside the U.S., the contract of carriage says that if local or international laws regulate the situation, Rule 24 is not applied, and United's plan says relevant local laws may also apply outside the U.S."
  - "This rule is for flights sold under a United (UA) flight number, including United Express flights. If your UA-numbered flight is operated by a partner airline, the plan doesn't say what rebooking that partner gives. The contract says United 'is responsible for the entirety of the Codeshare journey for all obligations to Passengers established in these rules.' If you hold a flight that United operates but another airline sold under its own flight number, ask the airline whose number is on your ticket. Its plan covers its scheduled flights."
sources:
  - id: s1
    source: ua-customer-service-plan
    quotes:
      - text: "We’ll give you the most up-to-date information about your rebooking options through united.com, the United app, at airport kiosks, or through our airport and contact center agents."
        supports: [how_to_claim.steps.0]
      - text: "We’ll get you on the next flight we have with available seats in the same cabin you’re traveling in at no additional cost."
        supports: [summary, applies_when, entitlement.amount, how_to_claim.steps.1]
      - text: "If your same-day cancellation or delay is caused by something within our control and a United flight is unavailable until the next day, ask us and United will book you on a partner airline’s flight via our existing interline agreements at no additional cost if they have seats available for United customers in your ticketed cabin."
        supports: [summary, entitlement.amount, exceptions, how_to_claim.steps.2]
      - text: "You can get a refund for your fare and any fees if your flight is significantly disrupted or oversold, and you choose to not accept our rebooking options or other compensation offered."
        supports: [exceptions]
      - text: "Flights with a schedule change or delay of at least 3 hours domestically, or 6 hours internationally"
        supports: [exceptions]
      - text: "Refunds are sent to your original form of payment, minus any applicable fees."
        supports: [exceptions]
      - text: "If you are outside the U.S., relevant local laws may also apply."
        supports: [exceptions]
  - id: s2
    source: ua-contract-of-carriage
    quotes:
      - text: "When a Passenger’s ticket is affected because of Irregular Operations caused by UA, UA will take the following measures:"
        supports: [exceptions]
      - text: "In the event a Passenger misses an onward connecting flight on which space is reserved because the Delivering Carrier did not operate its flight due to Irregular Operations or a Schedule Change, the Delivering Carrier is responsible to arrange for carriage of the Passenger or to make a refund."
        supports: [exceptions]
      - text: "At its sole discretion, UA may arrange for the passenger to travel on another carrier."
        supports: [exceptions]
      - text: "If space is only available and used on a UA flight(s) of a lower class of service than originally purchased by the passenger, UA will provide a refund of the difference in fare pursuant to Rule 27 C) 5)."
        supports: [exceptions]
      - text: "UA may re-accommodate Passengers on another available UA flight or on another carrier or combination of carriers, or via ground transportation, or may refund, in its sole discretion, any unused portions of the Ticket in the form of a travel certificate or travel credit."
        supports: [exceptions]
      - text: "Delay in scheduled departure or arrival of a carrier’s flight resulting in a Misconnection;"
        supports: [applies_when]
      - text: "Misconnection – occurs at a Connecting Point when a Passenger holding confirmed space on an Original Receiving Carrier is unable to use such confirmed space because the Delivering Carrier was unable to deliver him/her to the Connecting Point in time to connect with the Original Receiving Carrier’s flight."
        supports: [applies_when]
      - text: "If local or international laws regulate a Schedule Change, Force Majeure or Irregular Operations, then the procedures in Rule 24 will not be applied."
        supports: [exceptions]
      - text: "Transportation of Passengers and Baggage provided by United Airlines, Inc. and Carriers doing business as United Express, are subject to the following terms and conditions"
        supports: [applies_when]
      - text: "United Express carriers are Carriers not wholly owned or operated by United Airlines, Inc. but operating with the UA designator code under the trade name “United Express.”"
        supports: [applies_when]
      - text: "For Codeshare services on flights operated by another carrier, UA is responsible for the entirety of the Codeshare journey for all obligations to Passengers established in these rules."
        supports: [exceptions]
      - text: "Any condition beyond UA’s control including, but not limited to, meteorological or geological conditions, acts of God, riots, terrorist activities, civil commotions, embargoes, wars, hostilities, disturbances, or unsettled international conditions, either actual, anticipated, threatened or reported, or any delay, demand, circumstances, or requirement due directly or indirectly to such condition;"
        supports: [exceptions]
      - text: "Any strike, work stoppage, slowdown, lockout, or any other labor-related dispute involving or affecting UA’s services;"
        supports: [exceptions]
      - text: "Any governmental regulation, demand or requirement;"
        supports: [exceptions]
      - text: "Any shortage of labor, fuel, or facilities of UA or others;"
        supports: [exceptions]
      - text: "Damage to UA’s Aircraft or equipment caused by another party;"
        supports: [exceptions]
      - text: "Any emergency situation requiring immediate care or protection for a person or property; or"
        supports: [exceptions]
      - text: "Any event not reasonably foreseen, anticipated or predicted by UA."
        supports: [exceptions]
  - id: s3
    source: ecfr-14-cfr-259
    quotes:
      - text: "Each covered carrier must adopt a Customer Service Plan applicable to its scheduled flights as specified in paragraphs (b)(1) through (14) of this section and adhere to the plan's terms."
        supports: [exceptions, summary]
  - id: s4
    source: dot-customer-service-dashboard
    quotes:
      - text: "If you believe an airline has not fulfilled its commitment, contact the airline first to ensure it gives you what is owed."
        supports: [how_to_claim.steps.3]
lead_character: capybara
tags: [missed-connection, rebooking, delay, united]
