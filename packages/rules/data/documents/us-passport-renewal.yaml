id: us-passport-renewal
version: 1
status: draft
domain: documents
jurisdiction: US-STATE
title: "Renewing a US passport? Check if you can renew by mail or must apply in person, and renew early"
summary: >-
  USAGov says you can renew a US passport unless it was issued before your 16th birthday or more than 15 years ago, is
  damaged, lost or stolen, or is in a previous name you can't document. Then you apply in person with Form DS-11.
  Otherwise renew by mail with Form DS-82, or online if eligible. Renew early.
applies_when:
  all:
    - fact: passenger.nationality
      eq: US
entitlement:
  kind: requirement
  amount:
    renew_by_mail_or_online: your passport was not issued before your 16th birthday or more than 15 years ago, is not damaged, lost or stolen, and is in your current name or you can document the change
    form_for_renewal: DS-82
    form_for_new_application_in_person: DS-11
how_to_claim:
  steps:
    - "Check whether you can renew. You can't if your passport was issued before your 16th birthday, was issued more than 15 years ago, is damaged, lost or stolen, or is in a previous name and you have no legal document like a marriage license to prove the change."
    - "If you can't renew, apply for a new passport in person using Form DS-11."
    - "If you can renew by mail, you will typically need Form DS-82, a passport photo, the passport fee, your most recent passport, and name change documentation if necessary."
    - "Your most recent passport is mailed back to you separately after your new passport is mailed. USAGov says in most cases it should arrive about 4 weeks after you receive your new one."
    - "You may be able to renew online instead. The State Department offers the only authorized place to renew your passport online."
    - "If you need your passport quickly, look at the State Department's options for emergency or urgent travel and expedited processing. USAGov says there may be additional fees."
    - "Renew early, and check your destination's passport validity rules on the State Department's country information page."
  templates: []
exceptions:
  - "You can renew an expired passport only if it was issued within the last 15 years."
  - "Online renewal is only for those who meet the State Department's requirements."
  - "Some countries and airlines will not allow a U.S. passport holder to enter if their passport expires in less than 6 months."
  - "USAGov says passport processing times vary and points to the State Department for current processing times."
  - "If you are outside the U.S., contact the U.S. embassy or consulate near you to renew."
sources:
