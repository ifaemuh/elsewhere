id: us-ftc-vacation-rental-scams
version: 1
status: draft
domain: hotels
jurisdiction: US-FTC
title: "Booking a vacation rental? Spot the scam signs before you pay"
summary: >-
  The FTC warns that scammers hijack real rental listings or invent ones. Its signs of a scam: being told you can only
  pay by wire transfer, gift card, payment app or cryptocurrency, being rushed to decide, or rent far below comparable
  rentals. It also tells you how to check a listing and where to report.
applies_when:
  all:
    - fact: lodging.kind
      eq: short_term_rental
entitlement:
  kind: protection
  amount:
    payment_red_flag: the only way to pay is by wire transfer, gift card, payment app, or cryptocurrency
    pressure_red_flag: being pressured to decide right away
    price_red_flag: rent a lot less than comparable rentals
    check_listing: search online for the property's address plus the owner or rental company name, and check the rental company's own website
    report_to: ReportFraud.ftc.gov and your state attorney general
how_to_claim:
  steps:
    - "Search online for the rental property's address plus the name of the property owner or rental company listed. If other ads come up for the same address, especially with a different owner or rental company name, it's probably a scam."
    - "Check the rental company's website to see if the property is listed there too. If it isn't, the FTC says the listing is likely a scam."
    - "Check that the address of the property really exists. Look up the company, rental and agent with the words scam, review or complaint."
    - "Don't sign or pay until you know the terms of the deal. Get a copy of the cancellation and refund policies before you pay, and walk away if you can't get those details."
    - "Don't pay anyone who says you can only pay by wire transfer, gift card or cryptocurrency. The FTC says if someone says you can only pay with a payment app, it's probably a scam."
    - "If you think you were targeted by a travel scam, report it to the FTC at ReportFraud.ftc.gov and to your state attorney general."
  templates: []
exceptions:
  - "This is FTC consumer guidance, not a legal right. It doesn't give you a refund or set a deadline to claim one."
  - "The FTC says that if you pay with wire transfers, gift cards or cryptocurrency and there's a problem, you'll lose your money and there's likely no way to track it or get it back."
  - "The FTC page doesn't say how to dispute a charge or get money back after paying a scammer."
  - "The signs are warnings, not proof. The FTC says below-market rent can be a sign of a scam."
